{% if page.has_other_pages %}
<nav class="pagination" aria-label="Paginação">
{% if page.has_previous %}<a class="secondary-button" href="{% querystring page=page.previous_page_number %}">← Anterior</a>{% endif %}
<span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
{% if page.has_next %}<a class="secondary-button" href="{% querystring page=page.next_page_number %}">Próxima →</a>{% endif %}
</nav>{% endif %}
